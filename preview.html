<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{navy:{50:'#eff6ff',100:'#dbeafe',600:'#1d4ed8',700:'#1e3a8a',800:'#1e3270',900:'#172554'}},boxShadow:{card:'0 2px 8px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04)','card-hover':'0 8px 24px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06)'}}}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f8fafc}
.page{animation:fadeUp .22s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.13)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.badge{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.btn-primary{background:#1a5a1a;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#0f3d0f}
.btn-outline{background:transparent;border:2px solid #e2e8f0;border-radius:12px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;color:#475569;transition:border-color .15s,background .15s}
.btn-outline:hover{border-color:#94a3b8;background:#f8fafc}
.img-container{position:relative;overflow:hidden;background:#e2e8f0}
.img-container img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .img-container img{transform:scale(1.04)}
.notif-dot{position:absolute;top:-3px;right:-3px;background:#ef4444;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid white}
.input-field{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 16px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;transition:border-color .15s}
.input-field:focus{border-color:#3b82f6}
.cat-pill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:14px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;background:#fff}
.cat-pill.active{border-color:#1a5a1a;background:#f0fdf0}
.size-pill{width:44px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid #e2e8f0;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;color:#64748b}
.size-pill.active{border-color:#1a5a1a;background:#1a5a1a;color:#fff}
.int-btn{padding:8px 16px;border-radius:99px;border:2px solid #e2e8f0;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#64748b;transition:all .12s}
.int-btn.active-int{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.int-btn.active-com{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.int-btn.active-noint{border-color:#94a3b8;background:#f8fafc;color:#64748b}
.comment-card{background:#fff;border-radius:14px;padding:16px;border:1.5px solid #f1f5f9;transition:border-color .12s}
.comment-card:hover{border-color:#e2e8f0}
.hero-gradient{background:linear-gradient(135deg,#1a4a1a 0%,#2d7a2d 50%,#3a9a3a 100%)}
.filter-pill{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;transition:all .12s;white-space:nowrap}
.filter-pill.active{background:#1a5a1a;color:#fff;border-color:#1a5a1a}
</style>
</head>

  return`<span style="background:${bg};color:${c};border:1px solid ${c}33;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700">${i} ${n}d</span>`;
}
function cdBanner(d){
  const n=daysLeft(d);const exp=expiryOf(d).toLocaleDateString('es-AR',{day:'2-digit',month:'long'});
  if(n<=0)return'<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 14px;margin-bottom:14px"><p style="font-size:13px;font-weight:700;color:#dc2626">⛔ Esta publicación ha expirado (más de 60 días).</p></div>';
  if(n<=3)return`<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:10px 14px;margin-bottom:14px"><p style="font-size:13px;font-weight:700;color:#dc2626">🔴 ¡Quedan solo ${n} día${n!==1?'s':''}! Expira el ${exp}.</p></div>`;
  if(n<=14)return`<div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:10px 14px;margin-bottom:14px"><p style="font-size:13px;font-weight:600;color:#92400e">⚠️ Aviso: expira en ${n} días, el ${exp}.</p></div>`;
  return`<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:8px 14px;margin-bottom:14px"><p style="font-size:12px;color:#16a34a;font-weight:600">✅ Disponible ${n} días más · expira el ${exp}</p></div>`;
}

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <button type="button" data-it="interesado" onclick="selIt('interesado')" class="int-btn">⭐ Me interesa</button>

        <span id="ccount" style="font-size:12px;color:#94a3b8">0/500</span>

      </div>
    </div>
  </div>`:(!state.session?`
  <div style="margin-top:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1.5px solid #bfdbfe;border-radius:16px;padding:28px;text-align:center">
    <p style="font-size:16px;font-weight:700;color:#1e40af;margin-bottom:8px">¿Te interesa esta prenda?</p>

    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="go('login')" class="btn-primary">Iniciar sesión</button>
      <button onclick="go('register')" class="btn-outline">Registrarse</button>
    </div>
  </div>`:'');

  const ownerTip=isOwner&&item.status==='disponible'&&cc>0?`
  <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:14px 16px;margin-top:16px">
    <p style="font-size:13px;color:#92400e;font-weight:600">💡 Cuando hayas coordinado el intercambio, marcá la prenda como intercambiada. Se notificará a todos los interesados automáticamente.</p>
  </div>`:''

  const markArea=isOwner&&item.status==='disponible'?`
  <div id="markArea" style="margin-top:20px">
    <button onclick="showConfirm(${item.id})" style="width:100%;background:#16a34a;color:white;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer" class="hover:opacity-90 transition">✓ Marcar como intercambiado</button>
  </div>`:''

  const doneBlock=item.status==='intercambiado'?`
  <div style="background:#f8fafc;border-radius:14px;padding:20px;text-align:center;margin-top:16px">
    <div style="font-size:32px;margin-bottom:8px">🎉</div>
    <p style="font-size:15px;font-weight:700;color:#0f172a">Este intercambio ya fue realizado</p>
    <p style="font-size:13px;color:#64748b;margin-top:4px">Se notificó a todos los usuarios interesados.</p>
  </div>`:''

  return`<div class="page"><div style="min-height:100vh;background:#f8fafc">
  ${navbar()}
  <div style="max-width:900px;margin:0 auto;padding:28px 16px">
    <button onclick="go('home')" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:#3b82f6;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:20px">
      ← Volver al inicio
    </button>
    <div style="background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)">
      <div style="display:flex;flex-direction:column">
        <div style="display:flex;flex-wrap:wrap">
          <div style="flex:1;min-width:280px;min-height:320px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;position:relative">
            <img src="${item.img}" alt="${item.title}" style="width:100%;height:100%;object-fit:cover;max-height:420px"/>
            ${item.status==='intercambiado'?`<div style="position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center"><span style="background:white;border-radius:99px;padding:8px 20px;font-size:14px;font-weight:800;color:#1e293b">✓ Intercambiado</span></div>`:''}
          </div>
          <div style="flex:1;min-width:280px;padding:28px;display:flex;flex-direction:column">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px">
              <h1 style="font-size:22px;font-weight:800;color:#0f172a;line-height:1.3">${item.title}</h1>
              ${item.status==='intercambiado'?`<span class="tag" style="background:#1e293b;color:white;white-space:nowrap;flex-shrink:0">✓ Intercambiado</span>`:`<span class="tag" style="background:#dcfce7;color:#16a34a;white-space:nowrap;flex-shrink:0">● Disponible</span>`}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
              <span class="tag" style="background:${c.bg.replace('bg-','')};font-size:12px">${c.i} ${c.l}</span>
              <span class="tag" style="background:#f1f5f9;color:#475569;font-size:12px">Talle ${item.size}</span>
              ${(()=>{const sg=getSizeGroup(item.size);return sg?`<span class="tag" style="background:${SG_META[sg].bg};color:${SG_META[sg].color};font-size:12px">${SG_META[sg].label}</span>`:''})()}
              ${item.gender&&GEN_META[item.gender]?`<span class="tag" style="background:${GEN_META[item.gender].bg};color:${GEN_META[item.gender].color};font-size:12px">${GEN_META[item.gender].icon} ${GEN_META[item.gender].label}</span>`:''}
            </div>
            ${item.status==="disponible"?cdBanner(item.date):""}
            <p style="font-size:14px;color:#475569;line-height:1.7;margin-bottom:20px">${item.desc}</p>
            <div style="margin-top:auto;border-top:1px solid #f1f5f9;padding-top:16px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                ${av(item.uid,28)}
                <div><span style="font-size:13px;font-weight:700;color:#0f172a">${uname(item.uid)}</span><br/><span style="font-size:11px;color:#94a3b8">${item.date}</span></div>
              </div>
              <div style="display:flex;gap:14px;margin-top:10px">
                ${ic>0?`<span style="font-size:13px;font-weight:700;color:#16a34a">⭐ ${ic} interesado${ic!==1?'s':''}</span>`:''}
                ${cc>0?`<span style="font-size:13px;color:#94a3b8">💬 ${cc} comentario${cc!==1?'s':''}</span>`:''}
              </div>
            </div>
            ${markArea}
            ${doneBlock}
          </div>
        </div>
      </div>
    </div>
    <div style="margin-top:32px">
      <h2 style="font-size:18px;font-weight:800;color:#0f172a;margin-bottom:16px">Comentarios (${cc})</h2>
      ${cc===0?`<div style="background:white;border-radius:16px;padding:40px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)"><div style="font-size:36px;margin-bottom:12px">💬</div><p style="color:#64748b;font-size:14px">Todavía no hay comentarios. ¡Sé el primero!</p></div>`:''}
      <div style="display:flex;flex-direction:column;gap:10px" id="clist">${cmtList}</div>
      ${cmtForm}
      ${ownerTip}

  </div></div></div>`}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────────────
function renderNotifs(){
  if(!state.session){go('login');return''}
  const mine=state.notifs.filter(n=>n.uid===state.session.id);
  mine.forEach(n=>n.read=true);
  return`<div class="page"><div style="min-height:100vh;background:#f8fafc">
  ${navbar()}
  <div style="max-width:600px;margin:0 auto;padding:28px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h1 style="font-size:22px;font-weight:800;color:#0f172a">🔔 Notificaciones</h1>
      <button onclick="go('home')" style="color:#3b82f6;background:none;border:none;font-size:14px;font-weight:600;cursor:pointer">← Volver</button>
    </div>
    ${mine.length===0?`
    <div style="background:white;border-radius:20px;padding:60px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)">
      <div style="font-size:52px;margin-bottom:16px">🔔</div>
      <h3 style="font-size:17px;font-weight:700;color:#0f172a;margin-bottom:8px">No tenés notificaciones</h3>
      <p style="font-size:14px;color:#64748b;max-width:320px;margin:0 auto;line-height:1.6">Cuando alguien marque como intercambiada una prenda que te interesó, recibirás una notificación aquí.</p>
    </div>
    <div style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1.5px solid #bfdbfe;border-radius:14px;padding:16px;margin-top:14px;text-align:center">
      <p style="font-size:13px;color:#1d4ed8;line-height:1.6">💡 <strong>Probalo:</strong> entrá a una prenda, dejá un comentario con ⭐ "Me interesa". Si iniciás sesión como <strong>maría</strong> y entrás al pantalón, podés marcarlo como intercambiado para que Carlos reciba una notificación.</p>
    </div>
    `:`<div style="display:flex;flex-direction:column;gap:10px">
    ${mine.map(n=>`
    <div style="background:white;border-radius:14px;padding:16px;border:1.5px solid #f1f5f9;box-shadow:0 2px 6px rgba(0,0,0,.05)">
      <div style="display:flex;gap:12px">
        <span style="font-size:20px;flex-shrink:0;margin-top:2px">📦</span>
        <div style="flex:1">
          <p style="font-size:14px;font-weight:600;color:#0f172a;margin-bottom:4px">${n.msg}</p>
          ${n.ititle?`<p style="font-size:12px;color:#64748b;margin-bottom:6px">Prenda: <strong>${n.ititle}</strong></p>`:''}
          ${n.iid?`<button onclick="go('item',{selectedId:${n.iid}})" style="font-size:12px;color:#3b82f6;background:none;border:none;cursor:pointer;font-weight:600;padding:0">Ver prenda →</button>`:''}
          <p style="font-size:11px;color:#94a3b8;margin-top:6px">${n.date}</p>
        </div>
      </div>
    </div>`).join('')}
    </div>`}
  </div></div></div>`}

// ── EVENT BINDING ─────────────────────────────────────────────────────────────
function bind(){
  // login
  const lf=document.getElementById('lf');
  if(lf)lf.addEventListener('submit',e=>{e.preventDefault();
    const email=document.getElementById('le').value.trim().toLowerCase();
    const pass=document.getElementById('lp').value;
    const u=state.users.find(u=>u.email===email&&u.pass===pass);
    if(!u){const er=document.getElementById('lerr');er.textContent='Email o contraseña incorrectos.';er.style.display='block';}
    else{state.session=u;go('home');}
  });
  // register
  const rf=document.getElementById('rf');
  if(rf)rf.addEventListener('submit',e=>{e.preventDefault();
    const name=document.getElementById('rn').value.trim();
    const email=document.getElementById('re').value.trim().toLowerCase();
    const pass=document.getElementById('rp').value;
    if(state.users.find(u=>u.email===email)){const er=document.getElementById('rerr');er.textContent='El email ya está registrado.';er.style.display='block';return;}
    const nu={id:state.users.length+1,name,email,pass};
    state.users.push(nu);state.session=nu;go('home');
  });
  // new item
  const nf=document.getElementById('nf');
  if(nf)nf.addEventListener('submit',e=>{e.preventDefault();
    const ni={id:state.nextId++,uid:state.session.id,
      title:document.getElementById('ititle').value.trim(),
      cat:document.getElementById('icat').value,
      size:document.getElementById('isz').value,
      gender:document.getElementById('igen')?.value||'unisex',
      desc:document.getElementById('idesc').value.trim(),
      img:document.getElementById('iimg').value||IMGS[document.getElementById('icat').value+'1']||IMGS.remera1,
      status:'disponible',date:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'numeric'})};
    state.items.unshift(ni);go('item',{selectedId:ni.id});
  });
  // comment counter
  const ct=document.getElementById('ctext');
  if(ct)ct.addEventListener('input',()=>{const el=document.getElementById('ccount');if(el)el.textContent=ct.value.length+'/500';});
}

// ── INTERACTIVE SELECTORS ─────────────────────────────────────────────────────
function selCat(c){
  document.getElementById('icat').value=c;
  document.querySelectorAll('.cat-pill').forEach(b=>{
    const sel=b.dataset.cat===c;
    b.classList.toggle('active',sel);
    b.querySelector('span:last-child').style.color=sel?'#1e3270':'#64748b';
  });
}
function selSz(s){
  document.getElementById('isz').value=s;
  document.querySelectorAll('.size-pill').forEach(b=>b.classList.toggle('active',b.dataset.sz===s));
}
function selGen(g){
  document.getElementById('igen').value=g;
  ['nina','nino','unisex'].forEach(k=>{
    const btn=document.getElementById('genbtn-'+k);if(!btn)return;
    const active=k===g;
    btn.style.borderColor=active?GEN_META[k].color:'#e2e8f0';
    btn.style.background=active?GEN_META[k].bg:'#fff';
    btn.style.color=active?GEN_META[k].color:'#64748b';
  });
}
function selIt(t){
  document.getElementById('ctype').value=t;
  document.querySelectorAll('[data-it]').forEach(b=>{
    b.className='int-btn'+(b.dataset.it===t?{interesado:' active-int',comentario:' active-com',no_interesado:' active-noint'}[t]:'');
  });
  const ta=document.getElementById('ctext');
  if(ta)ta.placeholder=t==='interesado'?'¡Me interesa! Escribí algo para coordinar el intercambio...':'Escribí tu comentario o pregunta aquí...';
}
function handleImg(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const m=800;let w=img.width,h=img.height;
      if(w>m){h=Math.round(h*m/w);w=m;}if(h>m){w=Math.round(w*m/h);h=m;}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      const b=c.toDataURL('image/jpeg',.8);
      document.getElementById('iimg').value=b;
      const pv=document.getElementById('imgprev');
      const ph=document.getElementById('imgph');
      pv.src=b;pv.style.display='block';ph.style.display='none';
    };img.src=ev.target.result;
  };reader.readAsDataURL(file);
}
function showConfirm(id){
  const area=document.getElementById('markArea');
  if(!area)return;
  area.innerHTML=`
  <div style="margin-top:12px;border-radius:14px;overflow:hidden;border:1.5px solid #fde68a">
    <div style="background:#fffbeb;padding:14px 16px">
      <p style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:4px">¿Confirmar intercambio?</p>
      <p style="font-size:12px;color:#b45309">Se notificará a todos los usuarios que mostraron interés en esta prenda.</p>
    </div>
    <div style="display:flex;gap:0;background:white">
      <button onclick="go('item',{selectedId:${id}})" style="flex:1;padding:12px;border:none;border-right:1px solid #f1f5f9;cursor:pointer;font-size:13px;font-weight:600;color:#64748b;background:white" class="hover:opacity-80">Cancelar</button>
      <button onclick="doExchange(${id})" style="flex:1;padding:12px;border:none;cursor:pointer;font-size:13px;font-weight:800;color:#16a34a;background:white" class="hover:opacity-80">✓ Confirmar</button>
    </div>
  </div>`;
}
function doExchange(id){
  const item=state.items.find(i=>i.id===id);if(!item)return;
  item.status='intercambiado';
  const seen=new Set();
  state.comments.filter(c=>c.iid===id&&c.type==='interesado'&&c.uid!==state.session.id).forEach(c=>{
    if(!seen.has(c.uid)){seen.add(c.uid);
    state.notifs.push({id:state.nextNid++,uid:c.uid,iid:id,ititle:item.title,
      msg:`La prenda "${item.title}" que te interesaba ya fue intercambiada y no está más disponible.`,
      read:false,date:new Date().toLocaleString('es-AR')});}
  });
  go('item',{selectedId:id});
}
function subCmt(id){
  const text=document.getElementById('ctext').value.trim();
  const type=document.getElementById('ctype').value;
  if(!text)return;
  state.comments.push({id:state.nextCid++,iid:id,uid:state.session.id,type,text,date:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'short'})});
  go('item',{selectedId:id});
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  const pages={home:renderHome,login:renderLogin,register:renderRegister,new:renderNew,item:renderItem,notifs:renderNotifs};
  app.innerHTML=(pages[state.page]||renderHome)();
  bind();
}

// small fix for tailwind bg- colors in strings
const styleEl=document.createElement('style');
styleEl.textContent=`.bg-blue-50{background:#eff6ff}.bg-emerald-50{background:#ecfdf5}.bg-amber-50{background:#fffbeb}`;
document.head.appendChild(styleEl);

render();
</script>
